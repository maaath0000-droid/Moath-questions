<title>اختبار الأشكال الرباعية</title>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef4fb;--grid:#d3e0f1;--card:#fff;--ink:#12264a;--mute:#5b6b86;--blue:#2f6fcf;--blue2:#dce9fb;--gold:#f2b81f;--ok:#1b9a5f;--okbg:#dff5ea;--bad:#d93f49;--badbg:#fde4e6;--line:#c5d5ea;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a30;--grid:#1a2b49;--card:#16264a;--ink:#eaf1ff;--mute:#9db0d1;--blue:#6aa3f5;--blue2:#21386a;--gold:#f6c744;--ok:#4cd08e;--okbg:#14382c;--bad:#ff7a82;--badbg:#44202a;--line:#2d4575}}
:root[data-theme="dark"]{--bg:#0e1a30;--grid:#1a2b49;--card:#16264a;--ink:#eaf1ff;--mute:#9db0d1;--blue:#6aa3f5;--blue2:#21386a;--gold:#f6c744;--ok:#4cd08e;--okbg:#14382c;--bad:#ff7a82;--badbg:#44202a;--line:#2d4575}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;font-size:17px;line-height:1.7}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 40px}
h1,h2,.num{font-family:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif}
.card{background:var(--card);border:2px solid var(--ink);border-radius:18px;padding:20px;box-shadow:6px 6px 0 var(--blue)}
.hide{display:none!important}
.shapes{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:6px 0 18px}
.shapes svg{width:54px;height:54px}
.shapes svg:nth-child(odd){transform:rotate(-6deg)}
.shapes svg:nth-child(even){transform:rotate(5deg)}
.sh{fill:var(--blue2);stroke:var(--ink);stroke-width:3;stroke-linejoin:round}
.sh.g{fill:var(--gold)}
h1{font-size:34px;line-height:1.25;margin:0 0 8px;text-align:center}
.sub{text-align:center;color:var(--mute);margin:0 0 20px}
.btn{display:block;width:100%;font:inherit;font-weight:600;font-size:18px;padding:13px 18px;border-radius:14px;border:2px solid var(--ink);background:var(--gold);color:#12264a;cursor:pointer;box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn:focus-visible,.opt:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.btn.alt{background:var(--card);color:var(--ink);margin-top:12px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.bar{flex:1;height:14px;border:2px solid var(--ink);border-radius:99px;background:var(--card);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .4s}
.pill{font-weight:600;font-size:15px;border:2px solid var(--ink);border-radius:99px;padding:0 12px;background:var(--card);white-space:nowrap}
.qshape{display:flex;justify-content:center;margin-bottom:8px}
.qshape svg{width:64px;height:64px}
.tag{display:inline-block;font-size:14px;font-weight:600;color:var(--blue);margin-bottom:2px}
.q{font-size:21px;font-weight:600;line-height:1.55;margin:0 0 16px}
.opts{display:grid;gap:10px}
.opt{font:inherit;text-align:right;width:100%;padding:12px 14px;border-radius:13px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;display:flex;gap:10px;align-items:center;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt .k{flex:none;width:30px;height:30px;border-radius:9px;background:var(--blue2);display:grid;place-items:center;font-weight:600;font-size:15px}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt.ok .k{background:var(--ok);color:#fff}.opt.bad .k{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.fb{margin-top:14px;padding:12px 14px;border-radius:13px;border-inline-start:6px solid var(--ok);background:var(--okbg);font-size:16px}
.fb.no{border-color:var(--bad);background:var(--badbg)}
.fb b{display:block;font-size:18px}
.score{text-align:center}
.big{font-family:"Reem Kufi",sans-serif;font-size:72px;line-height:1;margin:6px 0}
.big small{font-size:28px;color:var(--mute)}
.stars{font-size:30px;letter-spacing:4px;margin-bottom:6px}
.rev{margin:18px 0 0;padding:0;list-style:none;text-align:right}
.rev li{padding:10px 12px;border-radius:12px;background:var(--badbg);margin-bottom:8px;font-size:15px;border-inline-start:5px solid var(--bad)}
.rev li span{color:var(--mute);display:block}
.theme{position:fixed;inset-inline-start:12px;top:calc(10px + env(safe-area-inset-top,0px));width:40px;height:40px;border-radius:50%;border:2px solid var(--ink);background:var(--card);color:var(--ink);font-size:18px;cursor:pointer;z-index:5}
.wrap{padding-top:56px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<button class="theme" id="theme" aria-label="تبديل الوضع الليلي">◐</button>
<div class="wrap">

<section id="start" class="card">
  <div class="shapes" id="shapes"></div>
  <h1>اختبار الأشكال الرباعية</h1>
  <p class="sub">١٣ سؤالاً عن المستطيل والمربع والمعين وشبه المنحرف ومتوازي الأضلاع والطائرة الورقية</p>
  <button class="btn" id="go">ابدأ الاختبار</button>
</section>

<section id="quiz" class="hide">
  <div class="top"><div class="bar"><i id="fill"></i></div><div class="pill" id="count">١ / ١٣</div><div class="pill" id="sc">⭐ ٠</div></div>
  <div class="card">
    <div class="qshape" id="qshape"></div>
    <div class="tag" id="tag"></div>
    <p class="q" id="q"></p>
    <div class="opts" id="opts"></div>
    <div class="fb hide" id="fb" role="status"></div>
    <button class="btn hide" id="next" style="margin-top:16px">السؤال التالي</button>
  </div>
</section>

<section id="end" class="card score hide">
  <div class="stars" id="stars"></div>
  <h2 id="verdict" style="margin:0;font-size:28px"></h2>
  <div class="big"><span id="final"></span><small> / ١٣</small></div>
  <p class="sub" id="msg"></p>
  <ul class="rev" id="rev"></ul>
  <button class="btn" id="again">أعد الاختبار</button>
</section>

</div>
<script>
var P={
 "المستطيل":"8,18 56,18 56,46 8,46",
 "المربع":"14,12 50,12 50,48 14,48",
 "المعين":"32,6 56,32 32,58 8,32",
 "شبه المنحرف":"20,16 44,16 58,48 6,48",
 "متوازي الأضلاع":"18,16 58,16 46,48 6,48",
 "الطائرة الورقية":"32,4 52,24 32,60 12,24"
};
function svg(n,g){return '<svg viewBox="0 0 64 64" aria-hidden="true"><polygon class="sh'+(g?' g':'')+'" points="'+P[n]+'"/></svg>'}
document.getElementById("shapes").innerHTML=Object.keys(P).map(function(n,i){return svg(n,i%3==1)}).join("");

var TF=["صح","خطأ"];
var Q=[
 {s:"المربع",q:"أي شكل رباعي جميع أضلاعه متطابقة وأقطاره متطابقة؟",o:["المربع","المعين","المستطيل","الطائرة الورقية"],a:0,e:"المربع تتحقق فيه جميع الخواص الأربع."},
 {s:"المستطيل",q:"ما الأضلاع المتطابقة في المستطيل؟",o:["جميعها","الضلعان المتقابلان","زوج الأضلاع الأمامية وزوج الأضلاع الخلفية","لا يوجد"],a:1,e:"في المستطيل كل ضلعين متقابلين متطابقان فقط."},
 {s:"المعين",q:"ما الأضلاع المتطابقة في المعين؟",o:["الضلعان المتقابلان فقط","لا يوجد","جميعها","زوج الأضلاع الأمامية فقط"],a:2,e:"المعين جميع أضلاعه الأربعة متطابقة."},
 {s:"المعين",q:"زوايا المعين قائمة.",o:TF,a:1,e:"زوايا المعين ليست قائمة، والمعين الذي زواياه قائمة يكون مربعاً."},
 {s:"المستطيل",q:"أقطار المستطيل متعامدة.",o:TF,a:1,e:"أقطار المستطيل متطابقة لكنها غير متعامدة."},
 {s:"شبه المنحرف",q:"أي شكل ليس فيه أضلاع متطابقة؟",o:["شبه المنحرف","متوازي الأضلاع","المعين","الطائرة الورقية"],a:0,e:"شبه المنحرف لا يوجد فيه أضلاع متطابقة، ولا أقطار متطابقة ولا متعامدة."},
 {s:"المعين",q:"أي شكل أقطاره متعامدة لكن زواياه ليست قائمة؟",o:["المستطيل","متوازي الأضلاع","المعين","شبه المنحرف"],a:2,e:"المعين أقطاره متعامدة فقط، أما أقطاره فغير متطابقة وزواياه غير قائمة."},
 {s:"الطائرة الورقية",q:"أقطار الطائرة الورقية متعامدة.",o:TF,a:0,e:"الطائرة الورقية أقطارها متعامدة فقط، وليست متطابقة."},
 {s:"المستطيل",q:"أي شكل زواياه قائمة وأقطاره متطابقة وغير متعامدة؟",o:["المعين","المستطيل","الطائرة الورقية","متوازي الأضلاع"],a:1,e:"المستطيل زواياه قائمة وأقطاره متطابقة، لكنها غير متعامدة."},
 {s:"متوازي الأضلاع",q:"أقطار متوازي الأضلاع متطابقة.",o:TF,a:1,e:"متوازي الأضلاع ليس فيه زوايا قائمة ولا أقطار متطابقة ولا متعامدة."},
 {s:"الطائرة الورقية",q:"ما الأضلاع المتطابقة في الطائرة الورقية؟",o:["جميعها","الضلعان المتقابلان","زوج الأضلاع الأمامية وزوج الأضلاع الخلفية","لا يوجد"],a:2,e:"في الطائرة الورقية يتطابق زوج الأضلاع الأمامية ويتطابق زوج الأضلاع الخلفية."},
 {s:"المربع",q:"أي شكلين من الآتي أقطارهما متعامدة؟",o:["المستطيل والمعين","المربع والمستطيل","المعين وشبه المنحرف","المربع والمعين"],a:3,e:"المربع والمعين أقطارهما متعامدة، أما المستطيل وشبه المنحرف فلا."},
 {s:"المربع",q:"المربع تتحقق فيه جميع الخواص: الأضلاع المتطابقة والزوايا القائمة والأقطار المتطابقة والمتعامدة.",o:TF,a:0,e:"المربع هو الشكل الوحيد في الجدول الذي تتحقق فيه جميعها."}
];
var AR="٠١٢٣٤٥٦٧٨٩";
function ar(n){return String(n).replace(/\d/g,function(d){return AR[d]})}
var L=["أ","ب","ج","د"];
var $=function(i){return document.getElementById(i)};
var i,score,streak,wrong,locked;

function show(id){["start","quiz","end"].forEach(function(x){$(x).classList.toggle("hide",x!==id)})}
function shuf(a){for(var k=a.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1));var t=a[k];a[k]=a[j];a[j]=t}return a}

function start(){i=0;score=0;wrong=[];show("quiz");render()}
function render(){
  locked=false;var q=Q[i];
  $("fill").style.width=(i/Q.length*100)+"%";
  $("count").textContent=ar(i+1)+" / "+ar(Q.length);
  $("sc").textContent="⭐ "+ar(score);
  $("qshape").innerHTML=svg(q.s,true);
  $("tag").textContent=q.o===TF?"صح أم خطأ":"اختر الإجابة الصحيحة";
  $("q").textContent=q.q;
  var idx=q.o.map(function(_,k){return k});
  if(q.o!==TF)shuf(idx);
  $("opts").innerHTML="";
  idx.forEach(function(k,pos){
    var b=document.createElement("button");b.className="opt";
    b.innerHTML='<span class="k">'+(q.o===TF?(k==0?"✓":"✕"):L[pos])+'</span><span>'+q.o[k]+'</span>';
    b.onclick=function(){pick(b,k)};b.dataset.k=k;$("opts").appendChild(b)});
  $("fb").classList.add("hide");$("next").classList.add("hide");
}
function pick(btn,k){
  if(locked)return;locked=true;var q=Q[i],good=k===q.a;
  Array.prototype.forEach.call($("opts").children,function(b){b.disabled=true;if(+b.dataset.k===q.a)b.classList.add("ok")});
  if(!good){btn.classList.add("bad");wrong.push(q)}else score++;
  var f=$("fb");f.className="fb"+(good?"":" no");
  f.innerHTML="<b>"+(good?"أحسنت! إجابة صحيحة":"إجابة غير صحيحة")+"</b>"+q.e;
  $("sc").textContent="⭐ "+ar(score);
  $("next").textContent=i==Q.length-1?"شاهد النتيجة":"السؤال التالي";
  $("next").classList.remove("hide");$("next").focus();
}
function next(){i++;if(i>=Q.length)finish();else render()}
function finish(){
  show("end");$("final").textContent=ar(score);
  var p=score/Q.length,st=p>=.9?3:p>=.65?2:p>=.4?1:0;
  $("stars").textContent="★".repeat(st)+"☆".repeat(3-st);
  $("verdict").textContent=p==1?"ممتاز! علامة كاملة":p>=.9?"أداء رائع":p>=.65?"جيد جداً":p>=.4?"تحتاج مراجعة بسيطة":"راجع الجدول وأعد المحاولة";
  $("msg").textContent=wrong.length?"أخطأت في "+ar(wrong.length)+" من الأسئلة، وهذه مراجعتها:":"أجبت عن كل الأسئلة بشكل صحيح.";
  $("rev").innerHTML=wrong.map(function(q){return "<li><b>"+q.q+"</b><span>"+q.e+"</span></li>"}).join("");
}
$("go").onclick=start;start();$("next").onclick=next;$("again").onclick=start;
$("theme").onclick=function(){var r=document.documentElement,d=getComputedStyle(r).getPropertyValue("--bg").trim()=="#0e1a30";r.setAttribute("data-theme",d?"light":"dark")};
</script>
